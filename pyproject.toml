[project]
name = "nlp1-student"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dario", email = "dariocatarrinho@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "baycomp>=1.0.3",
    "certifi>=2026.10.23",
    "datasets>=5.1.0",
    "ipywidgets>=8.1.9",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nltk>=3.10.4",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tabulate>=0.10.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
]

[project.scripts]
nlp1-student = "nlp1_student:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
